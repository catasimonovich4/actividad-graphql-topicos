services:
  - type: web
    name: productos-graphql
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: Productos
      # Se carga a mano en el dashboard de Render (no se versiona)
      - key: MONGODB_URI
        sync: false
